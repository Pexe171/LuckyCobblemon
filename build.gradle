plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (!project.hasProperty('visualCheck')) {
        modRuntimeOnly files('../../mods/Cobblemon-fabric-1.7.3+1.21.1.jar')
    }
    modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.13.10+kotlin.2.3.20"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Optional isolated Minecraft renderer check; never included in the released JAR.
if (project.hasProperty('visualCheck')) {
    sourceSets {
        visualCheck {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom {
        mods {
            luckycobblemon { sourceSet sourceSets.main }
            luckyvisualcheck { sourceSet sourceSets.visualCheck }
        }
        runs {
            client {
                runDir 'visual-run'
                programArgs '--width', '1280', '--height', '800'
            }
        }
    }
    tasks.named('runClient') {
        dependsOn tasks.named('visualCheckClasses')
        classpath sourceSets.visualCheck.output
    }
}
