plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    if (!project.hasProperty('visualCheck')) {
        def cobblemonRuntimeJar = providers.gradleProperty('cobblemon_runtime_jar').orNull
        if (cobblemonRuntimeJar != null) {
            def cobblemonFile = file(cobblemonRuntimeJar)
            if (!cobblemonFile.isFile()) {
                throw new GradleException("Cobblemon runtime JAR not found: ${cobblemonFile}")
            }
            modRuntimeOnly files(cobblemonFile)
        }
        modRuntimeOnly "net.fabricmc:fabric-language-kotlin:1.13.10+kotlin.2.3.20"
    }
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Optional isolated Minecraft renderer check; never included in the released JAR.
if (project.hasProperty('visualCheck')) {
    sourceSets {
        visualCheck {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom {
        mods {
            luckycobblemon { sourceSet sourceSets.main }
            luckyvisualcheck { sourceSet sourceSets.visualCheck }
        }
        runs {
            client {
                runDir 'visual-run'
                programArgs '--width', '1280', '--height', '800'
            }
        }
    }
    tasks.named('runClient') {
        dependsOn tasks.named('visualCheckClasses')
        classpath sourceSets.visualCheck.output
    }
}
