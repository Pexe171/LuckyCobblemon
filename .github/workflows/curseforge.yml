name: Publicar no CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: Tipo do arquivo no CurseForge
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

env:
  CURSEFORGE_PROJECT_ID: '1689137'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar e validar o Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verificar o token
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo "Adicione CURSEFORGE_API_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Compilar o lançamento
        run: ./gradlew clean build --stacktrace

      - name: Localizar o artefato
        id: artifact
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          JAR="build/libs/lucky-cobblemon-${VERSION}.jar"
          test -f "$JAR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Enviar para o CurseForge
        id: curseforge
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: ${{ steps.artifact.outputs.jar }}
          display_name: Lucky Cobblemon ${{ steps.artifact.outputs.version }}
          release_type: ${{ github.event.inputs.release_type || 'release' }}
          changelog: ${{ github.event.release.body || 'See the full changelog at https://github.com/Pexe171/LuckyCobblemon/blob/main/docs/curseforge-changelog.md' }}
          changelog_type: markdown
          game_versions: Minecraft 1.21:1.21.1,Java 21,Fabric,Client,Server
          relations: fabric-api:requiredDependency,cobblemon:requiredDependency,cobblemonraiddens:optionalDependency

      - name: Guardar o JAR publicado
        uses: actions/upload-artifact@v6
        with:
          name: curseforge-${{ env.CURSEFORGE_PROJECT_ID }}
          path: build/libs/lucky-cobblemon-*.jar
          if-no-files-found: error
